name: Backup semanal

on:
  schedule:
    - cron: '17 9 * * 0' # domingo, ~6h17 em Brasília
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar backup criptografado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: node scripts/backup.mjs
      - name: Guardar (90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: chachafinance-backup
          path: chachafinance-backup-*.json
          retention-days: 90
          if-no-files-found: ignore
